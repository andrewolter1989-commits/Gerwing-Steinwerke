<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gerwing Steinwerke</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.card-work{min-height:180px; transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;}
.card-work:hover{transform: translateY(-2px); box-shadow: 0 .5rem 1.2rem rgba(0,0,0,.12); background-color:#f8fbff;}
.card-work .btn{padding:14px 22px; font-size:1.05rem;}

  body{background:#f3f6f9;}
  h1{color:#0b5c8a;font-weight:700;}
  .card{border-radius:12px;}
  .btn-primary{background:#0b5c8a;border-color:#0b5c8a;}
  .btn-primary:hover{background:#06304a;transform:translateY(-1px);} 
.topbar{display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:18px;}
.topbar h1{margin:0;}
.logo{height:72px; width:auto; object-fit:contain;}

</style>
</head>
<body>
<div class="container py-4">
  <div class="topbar">
  <h1>Gerwing Steinwerke</h1>
  <img class="logo" src="logo_gerwing.png" alt="Gerwing Logo">
</div>
<div class="mb-3"><img src="logo_gerwing.png" alt="Gerwing" style="max-width:320px; height:auto;"></div>
  <div class="card shadow-sm card-work">
    <div class="card-body">
      <h5 class="card-title mb-2">Preisrechner öffnen</h5><p class="text-muted mb-3">Bitte Werk auswählen.</p>
      <div class="d-flex gap-3 flex-wrap">
        <a class="btn btn-primary btn-lg" href="preisrechner.html?werk=holdorf">Werk Holdorf</a>
        <a class="btn btn-primary btn-lg" href="preisrechner.html?werk=clausnitz">Werk Clausnitz</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
