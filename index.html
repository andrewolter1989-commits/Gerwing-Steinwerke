<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gerwing Steinwerke</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f7f9;color:#0b2230;}
.container{max-width:1100px;margin:32px auto;padding:0 20px;}
h1{font-size:44px;margin:0 0 18px;color:#0a5b7a;}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:22px;}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
.btn{display:inline-block;background:#0a5b7a;color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700;font-size:18px;transition:filter .15s,transform .15s;}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px);} 
</style>
</head>
<body>
<div class="container py-4">
  <div class="topbar">
  <h1>Gerwing Steinwerke</h1>
  </div>
<div class="mb-3"></div>
  <div class="card shadow-sm card-work">
    <div class="card-body">
      <h5 class="card-title mb-2">Preisrechner öffnen</h5><p class="text-muted mb-3">Bitte Werk auswählen.</p>
      <div class="d-flex gap-3 flex-wrap">
        <a class="btn btn-primary btn-lg" href="preisrechner.html?werk=holdorf">Werk Holdorf</a>
        <a class="btn btn-primary btn-lg" href="preisrechner.html?werk=clausnitz">Werk Clausnitz</a>
      </div>
    </div>
  </div>
