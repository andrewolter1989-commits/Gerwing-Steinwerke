<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gerwing Steinwerke Preisrechner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f7f9;color:#0b2230;}
    .brand{color:#0a5b7a;font-weight:900;letter-spacing:.2px}
    .card{border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08);}
    .table thead th{background:#0a5b7a;color:#fff;border-color:#0a5b7a;white-space:nowrap;}
    .btn-primary{background:#0a5b7a;border-color:#0a5b7a;font-weight:800;border-radius:12px;padding:10px 18px;}
    .btn-outline-secondary{border-radius:12px;padding:10px 18px;font-weight:700;}
    .summary{background:#d9f2de;border-radius:10px;border:1px solid rgba(0,0,0,.05);}
    .hint{background:#fff3cd;border:1px solid rgba(0,0,0,.06);border-radius:10px;}
    .err{background:#f8d7da;border:1px solid rgba(220,53,69,.25);border-radius:10px;}
    .muted{color:#6c757d}
  </style>
</head>
<body>
<div class="container py-4" style="max-width:1200px">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
    <div>
      <h1 class="display-6 brand mb-0" id="title">Gerwing Steinwerke Preisrechner</h1>
    </div>
    <a class="btn btn-outline-secondary" href="index.html">Zurück</a>
  </div>

  <div class="card p-4 mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label fw-bold">PLZ</label>
        <input id="plz1" class="form-control" placeholder="z. B. 27777" inputmode="numeric">
      </div>
      <div class="col-md-5">
        <label class="form-label fw-bold">Gewicht (kg)</label>
        <input id="w1" class="form-control" placeholder="z. B. 2500" inputmode="decimal">
      </div>
      <div class="col-md-2 d-grid gap-2">
        <button id="btnCalc" class="btn btn-primary">Berechnen</button>
        <button id="btnReset" class="btn btn-outline-secondary">Zurücksetzen</button>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-4 mt-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="chkBaustelle">
        <label class="form-check-label" for="chkBaustelle">Baustelle</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="chk2">
        <label class="form-check-label" for="chk2">Zweiter Stopp</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="chk3">
        <label class="form-check-label" for="chk3">Dritter Stopp</label>
      </div>
    </div>

    <div id="stop2Box" class="card p-3 mt-3 d-none">
      <div class="fw-bold mb-2">2. Stopp</div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">PLZ 2</label>
          <input id="plz2" class="form-control" placeholder="z. B. 27777" inputmode="numeric">
        </div>
        <div class="col-md-6">
          <label class="form-label">Gewicht 2 (kg)</label>
          <input id="w2" class="form-control" placeholder="z. B. 2500" inputmode="decimal">
        </div>
      </div>
    </div>

    <div id="stop3Box" class="card p-3 mt-3 d-none">
      <div class="fw-bold mb-2">3. Stopp</div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">PLZ 3</label>
          <input id="plz3" class="form-control" placeholder="z. B. 27777" inputmode="numeric">
        </div>
        <div class="col-md-6">
          <label class="form-label">Gewicht 3 (kg)</label>
          <input id="w3" class="form-control" placeholder="z. B. 2500" inputmode="decimal">
        </div>
      </div>
    </div>

    <div id="msgErr" class="err p-3 mt-3 d-none"></div>
    <div id="msgHint" class="hint p-3 mt-3 d-none"></div>

    <div class="summary p-3 mt-3">
      <div class="row">
        <div class="col-md-7" id="summaryLeft">
          <div><b>PLZ:</b> —</div>
          <div><b>Gewicht:</b> —</div>
          <div><b>Optionen:</b> —</div>
          <div class="mt-2"><b>Gesamtgewicht / Stops / Baustelle:</b> —</div>
          <div><b>Stops:</b> —</div>
        </div>
        <div class="col-md-5 text-md-end" id="summaryRight">
          <div class="fw-bold">Günstigster Anbieter</div>
          <div>—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive card">
    <table class="table table-striped mb-0">
      <thead>
        <tr>
          <th>Spediteur</th>
          <th>Zone</th>
          <th>Basis (€)</th>
          <th data-col="baz">Baustelle (€)</th>
          <th data-col="s2">2. Stopp (€)</th>
          <th data-col="s3">3. Stopp (€)</th>
          <th>Floater (%)</th>
          <th>Floater (€)</th>
          <th>Preis (€)</th>
          <th>Grund</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="placeholder"><td colspan="10" class="muted">Noch keine Berechnung.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="common.js"></script>
<script>
let DATA = null;


function setColVisible(col, visible){
  document.querySelectorAll(`[data-col="${col}"]`).forEach(el=>{
    el.style.display = visible ? "" : "none";
  });
}
function updateColumnVisibility(){
  const bazOn = document.getElementById('chkBaustelle').checked;
  const s2On  = document.getElementById('chk2').checked;
  const s3On  = document.getElementById('chk3').checked;
  setColVisible('baz', bazOn);
  setColVisible('s2', s2On);
  setColVisible('s3', s3On);
  // update placeholder colspan
  const thCount = document.querySelectorAll('thead th:not([style*="display: none"])').length;
  const ph = document.querySelector('#tbody tr.placeholder td');
  if(ph) ph.colSpan = thCount;
}
function showErr(msg){
  const el = document.getElementById("msgErr");
  el.textContent = msg;
  el.classList.remove("d-none");
}
function clearErr(){
  document.getElementById("msgErr").classList.add("d-none");
  document.getElementById("msgErr").textContent = "";
}
function showHint(msg){
  const el = document.getElementById("msgHint");
  el.textContent = msg;
  el.classList.remove("d-none");
}
function clearHint(){
  document.getElementById("msgHint").classList.add("d-none");
  document.getElementById("msgHint").textContent = "";
}

function normalizePlz(v){
  const s = String(v||"").trim();
  const m = s.match(/\d{5}/);
  return m ? m[0] : "";
}
function parseKg(v){
  const s = String(v||"").trim().replace(/\s/g,"");
  if(!s) return NaN;
  // allow german comma
  const n = Number(s.replace(",","."));
  return Number.isFinite(n) ? n : NaN;
}

function findHeaderRow(rows, required){
  for(let i=0;i<rows.length;i++){
    const norm = rows[i].map(normalizeHeader);
    let ok=true;
    for(const r of required){
      if(!norm.some(h=>h.includes(r))) { ok=false; break; }
    }
    if(ok) return {i, norm};
  }
  return null;
}

function buildZones(rows){
  const found = findHeaderRow(rows, ["forwarder","dest from","dest to","zone"]);
  if(!found) throw new Error("zones: Header nicht gefunden.");
  const header = found.norm;
  const idxF = header.findIndex(h=>h.includes("forwarder"));
  const idxFrom = header.findIndex(h=>h.includes("dest from"));
  const idxTo = header.findIndex(h=>h.includes("dest to"));
  const idxZone = header.findIndex(h=>h.includes("zone"));
  const map = new Map();
  for(let r=found.i+1;r<rows.length;r++){
    const row = rows[r];
    const f = row[idxF]?.trim();
    if(!f) continue;
    const from = parseInt(row[idxFrom],10);
    const to = parseInt(row[idxTo],10);
    const zone = parseInt(row[idxZone],10);
    if(!Number.isFinite(from) || !Number.isFinite(to) || !Number.isFinite(zone)) continue;
    if(!map.has(f)) map.set(f, []);
    map.get(f).push({from,to,zone});
  }
  // sort ranges
  for(const [k,v] of map.entries()){
    v.sort((a,b)=>a.from-b.from);
  }
  return map;
}

function buildRates(rows){
  const found = findHeaderRow(rows, ["forwarder","chg from","chg to","unit"]);
  if(!found) throw new Error("rates: Header nicht gefunden.");
  const header = found.norm;
  const idxF = header.findIndex(h=>h.includes("forwarder"));
  const idxFrom = header.findIndex(h=>h.includes("chg from"));
  const idxTo = header.findIndex(h=>h.includes("chg to"));
  const idxUnit = header.findIndex(h=>h.includes("unit"));
  // zone columns
  const zoneCols = [];
  for(let i=0;i<header.length;i++){
    const m = header[i].match(/zone\s*(\d+)/);
    if(m) zoneCols.push({zone: parseInt(m[1],10), idx:i});
  }
  if(zoneCols.length===0) throw new Error("rates: Keine Zone-Spalten gefunden.");
  const map = new Map();
  for(let r=found.i+1;r<rows.length;r++){
    const row = rows[r];
    const f = row[idxF]?.trim();
    if(!f) continue;
    const from = parseEuro(row[idxFrom]);
    const to = parseEuro(row[idxTo]);
    const unit = (row[idxUnit]||"").trim();
    if(!Number.isFinite(from) || !Number.isFinite(to)) continue;
    const prices = new Map();
    for(const zc of zoneCols){
      const p = parseEuro(row[zc.idx]);
      if(Number.isFinite(p)) prices.set(zc.zone, p);
    }
    if(!map.has(f)) map.set(f, []);
    map.get(f).push({from,to,unit,prices});
  }
  for(const [k,v] of map.entries()){
    v.sort((a,b)=>a.from-b.from);
  }
  return map;
}

function zoneForPlz(zonesMap, forwarder, plz){
  const ranges = zonesMap.get(forwarder);
  if(!ranges) return null;
  const p = parseInt(plz,10);
  for(const rg of ranges){
    if(p>=rg.from && p<=rg.to) return rg.zone;
  }
  return null;
}

function bandForWeight(ratesMap, forwarder, kg){
  const bands = ratesMap.get(forwarder);
  if(!bands) return null;
  for(const b of bands){
    if(kg>=b.from && kg<=b.to) return b;
  }
  return null;
}

function setSummary(stops, opts, cheapest){
  const totalKg = stops.reduce((s,x)=>s+x.kg,0);
  const stopsTxt = stops.map((s,i)=>`PLZ${i+1}: ${s.plz} / Gewicht${i+1}: ${money(s.kg)} kg`).join(" | ");
  const left = document.getElementById("summaryLeft");
  left.innerHTML = `
    <div><b>PLZ:</b> ${stops[0]?.plz || "—"}</div>
    <div><b>Gewicht:</b> ${money(stops[0]?.kg)} kg</div>
    <div><b>Optionen:</b> ${opts.length?opts.join(", "):"—"}</div>
    <div class="mt-2"><b>Gesamtgewicht / Stops / Baustelle:</b> ${money(totalKg)} kg / ${stops.length} Stop${stops.length>1?"s":""} / ${opts.includes("Baustelle")?"Baustellentour":"Standard"}</div>
    <div><b>Stops:</b> ${stopsTxt}</div>
  `;
  const right = document.getElementById("summaryRight");
  right.innerHTML = `<div class="fw-bold">Günstigster Anbieter</div><div>${cheapest||"—"}</div>`;
}

function renderRows(rows){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  if(rows.length===0){
    tbody.innerHTML = `<tr><td colspan="10" class="muted">Keine Daten.</td></tr>`;
    return;
  }
  for(const r of rows){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.forwarder}</td>
      <td>${r.zone ?? "—"}</td>
      <td>${money(r.base)}</td>
      <td>${moneyOpt(r.baustelle)}</td>
      <td>${moneyOpt(r.stop2)}</td>
      <td>${moneyOpt(r.stop3)}</td>
      <td>${r.floaterPct.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})}%</td>
      <td>${moneyOpt(r.floaterEur)}</td>
      <td>${money(r.total)}</td>
      <td>${r.reason || ""}</td>
    `;
    tbody.appendChild(tr);
  }
}

function validateStops(){
  const stops = [];
  const plz1 = normalizePlz(document.getElementById("plz1").value);
  const w1 = parseKg(document.getElementById("w1").value);
  if(!plz1) throw new Error("PLZ ist ein Pflichtfeld (5-stellig).");
  if(!Number.isFinite(w1) || w1<=0) throw new Error("Gewicht ist ein Pflichtfeld (> 0).");
  stops.push({plz:plz1, kg:w1});

  if(document.getElementById("chk2").checked){
    const plz2 = normalizePlz(document.getElementById("plz2").value);
    const w2 = parseKg(document.getElementById("w2").value);
    if(!plz2) throw new Error("PLZ 2 ist Pflicht, wenn 'Zweiter Stopp' aktiv ist.");
    if(!Number.isFinite(w2) || w2<=0) throw new Error("Gewicht 2 ist Pflicht (> 0), wenn 'Zweiter Stopp' aktiv ist.");
    stops.push({plz:plz2, kg:w2});
  }
  if(document.getElementById("chk3").checked){
    const plz3 = normalizePlz(document.getElementById("plz3").value);
    const w3 = parseKg(document.getElementById("w3").value);
    if(!plz3) throw new Error("PLZ 3 ist Pflicht, wenn 'Dritter Stopp' aktiv ist.");
    if(!Number.isFinite(w3) || w3<=0) throw new Error("Gewicht 3 ist Pflicht (> 0), wenn 'Dritter Stopp' aktiv ist.");
    stops.push({plz:plz3, kg:w3});
  }
  return stops;
}

function calc(){
  clearErr();
  clearHint();
  if(!DATA) { showErr("Daten sind noch nicht geladen."); return; }

  let stops, opts=[];
  try{
    stops = validateStops();
  }catch(e){
    showErr(e.message);
    return;
  }
  if(document.getElementById("chkBaustelle").checked) opts.push("Baustelle");
  if(document.getElementById("chk2").checked) opts.push("2. Stopp");
  if(document.getElementById("chk3").checked) opts.push("3. Stopp");

  const totalKg = stops.reduce((s,x)=>s+x.kg,0);

  const rows=[];
  let cheapest=null;
  let cheapestVal=Infinity;

  for(const forwarder of DATA.forwarders){
    // zone based on first stop (typical); you can extend per stop if needed
    const zone = zoneForPlz(DATA.zones, forwarder, stops[0].plz);
    if(zone==null){
      rows.push({forwarder, zone:"—", base:NaN, baustelle:NaN, stop2:NaN, stop3:NaN, floaterPct: DATA.floater[forwarder] ?? 0, floaterEur:NaN, total:NaN, reason:"Keine Zone"});
      continue;
    }
    const band = bandForWeight(DATA.rates, forwarder, totalKg);
    if(!band){
      rows.push({forwarder, zone, base:NaN, baustelle:NaN, stop2:NaN, stop3:NaN, floaterPct: DATA.floater[forwarder] ?? 0, floaterEur:NaN, total:NaN, reason:"Kein Gewichtsband"});
      continue;
    }
    const base = band.prices.get(zone);
    if(!Number.isFinite(base)){
      rows.push({forwarder, zone, base:NaN, baustelle:NaN, stop2:NaN, stop3:NaN, floaterPct: DATA.floater[forwarder] ?? 0, floaterEur:NaN, total:NaN, reason:`Kein Preis für Zone ${zone}`});
      continue;
    }

    let reason = "";
    // surcharges (supports both JSON formats)
    const sur = DATA.surcharges || {};
    const getSur = (key)=>{
      // format A: { "Forwarder": {"baustelle": 0, "stop2": 0, "stop3": 0} }
      if(sur[forwarder] && typeof sur[forwarder] === 'object'){
        const v = sur[forwarder][key];
        if(Number.isFinite(v)) return v;
      }
      // format B: { "baustelle": {"Forwarder": 0}, "stop2": {...}, "stop3": {...} }
      if(sur[key] && typeof sur[key] === 'object'){
        const v = sur[key][forwarder];
        if(Number.isFinite(v)) return v;
      }
      return NaN;
    };

    const needB = document.getElementById("chkBaustelle").checked;
    const need2 = document.getElementById("chk2").checked;
    const need3 = document.getElementById("chk3").checked;

    let baustelle = NaN, s2 = NaN, s3 = NaN;

    if(needB){
      const v = getSur('baustelle');
      if(Number.isFinite(v)) baustelle = v;
      else reason = reason || "Keine Baustellenzustellung";
    }
    if(need2){
      const v = getSur('stop2');
      if(Number.isFinite(v)) s2 = v;
      else reason = reason || "Kein 2. Stopp";
    }
    if(need3){
      const v = getSur('stop3');
      if(Number.isFinite(v)) s3 = v;
      else reason = reason || "Kein 3. Stopp";
    }

    const floPct = Number(DATA.floater[forwarder] ?? 0);
    const floEur = Number.isFinite(base) ? round2(base * (floPct/100)) : NaN;

    const ok = Number.isFinite(base)
      && (!needB || Number.isFinite(baustelle))
      && (!need2 || Number.isFinite(s2))
      && (!need3 || Number.isFinite(s3));

    const total = ok ? round2(
      base
      + floEur
      + (needB ? baustelle : 0)
      + (need2 ? s2 : 0)
      + (need3 ? s3 : 0)
    ) : NaN;

    rows.push({forwarder, zone, base, baustelle, stop2:s2, stop3:s3, floaterPct:floPct, floaterEur:floEur, total, reason});

    if(Number.isFinite(total) && total < cheapestVal){
      cheapestVal = total;
      cheapest = `${forwarder} (${money(total)} €)`;
    }
  }

  updateColumnVisibility();
  renderRows(rows);
  setSummary(stops, opts, cheapest);
}

async function loadData(){
  const werk = (qsParam("werk") || qsParam("work") || "holdorf").toLowerCase();
  const pretty = werk==="clausnitz" ? "Werk Clausnitz" : "Werk Holdorf";
  document.getElementById("title").textContent = `Gerwing Steinwerke Preisrechner — ${pretty}`;

  const zonesFile = `zones_${werk}.csv`;
  const ratesFile = `rates_${werk}.csv`;
  const floFile = `floater_${werk}.json`;
  const surFile = `surcharges_${werk}.json`;

  try{
    const [zTxt, rTxt, fTxt, sTxt] = await Promise.all([
      fetchText(zonesFile),
      fetchText(ratesFile),
      fetchText(floFile),
      fetchText(surFile),
    ]);
    const zonesRows = parseCsv(zTxt);
    const ratesRows = parseCsv(rTxt);
    const zones = buildZones(zonesRows);
    const rates = buildRates(ratesRows);
    const flo = JSON.parse(fTxt);
    const sur = JSON.parse(sTxt);

    // forwarders = intersection of zones & rates (stable)
    const set = new Set([...zones.keys()].filter(x => rates.has(x)));
    const forwarders = [...set].sort((a,b)=>a.localeCompare(b,"de"));

    DATA = {werk, zones, rates, floater: flo||{}, surcharges: sur||{}, forwarders};
    showHint(`Daten geladen: ${forwarders.length} Spediteure.`);
  }catch(e){
    showErr(e.message || String(e));
  }
}

function wireUI(){
  document.getElementById("btnCalc").addEventListener("click", calc);
  document.getElementById("btnReset").addEventListener("click", ()=>{
    clearErr(); clearHint();
    for(const id of ["plz1","w1","plz2","w2","plz3","w3"]){ document.getElementById(id).value=""; }
    for(const id of ["chkBaustelle","chk2","chk3"]){ document.getElementById(id).checked=false; }
    document.getElementById("stop2Box").classList.add("d-none");
    document.getElementById("stop3Box").classList.add("d-none");
    document.getElementById("tbody").innerHTML = `<tr class="placeholder"><td colspan="10" class="muted">Noch keine Berechnung.</td></tr>`;
    document.getElementById("summaryLeft").innerHTML = `
      <div><b>PLZ:</b> —</div>
      <div><b>Gewicht:</b> —</div>
      <div><b>Optionen:</b> —</div>
      <div class="mt-2"><b>Gesamtgewicht / Stops / Baustelle:</b> —</div>
      <div><b>Stops:</b> —</div>
    `;
    document.getElementById("summaryRight").innerHTML = `<div class="fw-bold">Günstigster Anbieter</div><div>—</div>`;
    updateColumnVisibility();
  });

  const chk2 = document.getElementById("chk2");
  const chk3 = document.getElementById("chk3");
  chk2.addEventListener("change", ()=>{ document.getElementById("stop2Box").classList.toggle("d-none", !chk2.checked); });
  chk2.addEventListener("change", updateColumnVisibility);
  chk3.addEventListener("change", updateColumnVisibility);
  document.getElementById("chkBaustelle").addEventListener("change", updateColumnVisibility);
  updateColumnVisibility();
  chk3.addEventListener("change", ()=>{ document.getElementById("stop3Box").classList.toggle("d-none", !chk3.checked); });
}

wireUI();
loadData();
</script>
</body>
</html>
