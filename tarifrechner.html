<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>Preisrechner</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <style>
    :root {
      --gp-blue:   #005A99;
      --gp-teal:   #00A99D;
      --gp-light:  #F2F6F8;
      --gp-dark:   #333333;
      --gp-white:  #FFFFFF;
      --gp-highlight: #d4edda;
    }
    * { box-sizing: border-box; }
    body { font-family: Arial,sans-serif; background: var(--gp-light); color: var(--gp-dark); margin: 2rem; }
    h1 { color: var(--gp-blue); margin-bottom:1rem; }
    .settings-buttons button { background: var(--gp-teal); color: var(--gp-white); border: none; padding: .5rem 1rem; margin-right: .5rem; border-radius: 4px; cursor: pointer; }
    .settings-buttons button:hover { background: var(--gp-blue); }
    .inputs { display: flex; flex-direction: column; gap:1rem; margin-bottom:1rem; }
    #secondInputs { display:none; }
    input[type=number] { padding:.4rem; border:1px solid #ccc; border-radius:4px; }
    button#calc { background: var(--gp-blue); color: var(--gp-white); border: none; padding:.5rem 1rem; border-radius:4px; cursor: pointer;  margin-left:2rem;}
    button#calc:hover { background: var(--gp-teal); }
    .summary { display: none; margin-top:1rem; padding:1rem; background: var(--gp-highlight); border:1px solid #ddd; border-radius:4px; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; background: var(--gp-white); }
    th, td { padding:.75rem; text-align:left; border-bottom:1px solid #ddd; }
    th { background: var(--gp-blue); color:#fff; }
    tr:nth-child(even) { background: var(--gp-light); }
    .highlight { background-color: var(--gp-highlight)!important; }
    .hide { display: none; }
  
    
    

    
    






    .inputs .checkboxes {
        display: flex;
        align-items: center;
        gap: 5rem;
        margin-bottom: 1rem;
    }
    .inputs .mainInputs,
.inputs .secondaryInputs,
.inputs .tertiaryInputs {
  display: inline-flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1rem;
}
    .inputs .mainInputs label,
    .inputs .secondaryInputs label {
  display: inline-flex;
  align-items: center;
  gap: 2rem;
  margin-bottom: 1rem;
}


/* === ChatGPT Layout Adjustments === */
.settings-buttons{
  position:absolute;
  top:2rem;
  right:2rem;
  display:flex;
  flex-direction:column;
  gap:.5rem;
}
.settings-buttons button{
  margin:0;
}
#calc{
  width:auto;
}


/* Anpassungen für Checkbox-Styling und Input-Alignment */

.inputs .checkboxes label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--gp-light);
  padding: 0.5rem 1rem;
  border-radius: 4px;
}



.inputs .mainInputs label, .inputs .secondaryInputs label {
  display: inline-flex;
  align-items: center;
  gap: 2rem;
  margin-bottom: 1rem;
}


/* Hide PLZ label in second input row */



/* Einheitliche Input-Breite */
.inputs input[type=number] {
  width: 12ch;
}


/* Einheitliches, kompaktes Layout für Eingabezeilen */
.inputs .mainInputs,
.inputs .secondaryInputs,
.inputs .tertiaryInputs {
  display: inline-flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1rem;
}
.inputs label {
  white-space: nowrap;
  width: 6ch;
  display: inline-block;
  margin-right: 0.5rem;
}
.inputs input[type="number"] {
  width: 12ch;
  padding: 0.3rem;
  border-radius: 4px;
  border: 1px solid #ccc;
}


/* Verbesserte Checkbox-Darstellung */
.inputs .checkboxes label {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--gp-light);
  padding: 0.5rem 1rem;
  border-radius: 4px;
  margin-right: 1rem;
}
.inputs .checkboxes input[type="checkbox"] {
  accent-color: var(--gp-blue);
  transform: scale(1.2);
}


/* Einheitliche Label-Breite für perfekt ausgerichtete Felder */
.inputs .mainInputs label,
.inputs .secondaryInputs label,
.inputs .tertiaryInputs label {
  display: inline-flex;
  align-items: center;
  gap: 2rem;
  margin-bottom: 1rem;
}


.inputs label {
  white-space: nowrap;
  width: 6ch;
  display: inline-block;
  margin-right: 0.5rem;
}
.inputs input[type="number"] {
  width: 12ch;
  padding: 0.3rem;
  border-radius: 4px;
  border: 1px solid #ccc;
}

</style>
</head>
<body>

  <h1>Preisrechner</h1>

  <div class="settings-buttons">
    <button onclick="location.href='baustelle.html'">Zuschläge</button>
    <button onclick="location.href='floater.html'">Dieselfloater</button>
  </div>

  <div class="inputs">
  <div class="checkboxes">
    <label><input type="checkbox" id="baustelleChk" onchange="updateVisibility()"> Baustelle</label>
    <label><input type="checkbox" id="secondChk" onchange="toggleSecond()"> Zweiter Stopp</label>
    <label><input type="checkbox" id="thirdChk" onchange="toggleThird()"> Dritter Stopp</label>
  </div>
  <div class="mainInputs">
    <label>PLZ:</label><input id="plz1" type="number" placeholder="27777">
    <label>Gewicht:</label><input id="w1" type="number" placeholder="2500">
    <button id="calc">Berechnen</button>
  </div>
  <div id="secondInputs" class="secondaryInputs">
    <label>PLZ&nbsp;2:</label><input id="plz2" type="number" placeholder="27777">
    <label>Gewicht&nbsp;2:</label><input id="w2" type="number" placeholder="2500">
  </div>
  <div id="thirdInputs" class="tertiaryInputs" style="display:none;">
    <label>PLZ&nbsp;3:</label><input id="plz3" type="number" placeholder="27777">
    <label>Gewicht&nbsp;3:</label><input id="w3" type="number" placeholder="2500">
  </div>
  
</div>

  <div class="summary" id="summary"></div>

    <tbody id="tbody"></tbody>
  </table>
