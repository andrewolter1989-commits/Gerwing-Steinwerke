<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dieselfloater Editor – Gerwing Steinwerke</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f7f9;color:#0b2230;}
.container{max-width:1100px;margin:28px auto;padding:0 20px;}
h1{margin:0 0 18px;color:#0a5b7a;}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:20px;}
.btn{display:inline-block;background:#0a5b7a;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;}
.btn.secondary{background:#fff;color:#0a5b7a;border:1px solid #0a5b7a;}
.table{width:100%;border-collapse:collapse;margin-top:14px;}
.table th{background:#0a5b7a;color:#fff;text-align:left;padding:10px;}
.table td{padding:10px;border-bottom:1px solid #e6eef2;}
.notice{background:#fff3cd;border:1px solid #ffe69c;border-radius:10px;padding:12px;margin:12px 0;}
.error{background:#f8d7da;border:1px solid #f1aeb5;border-radius:10px;padding:12px;margin:12px 0;display:none;}
</style>
</head>
<body>
<div class="container">
  <h1>Dieselfloater Editor – Gerwing Steinwerke</h1>
  <div class="card">
    <div class="notice">Diese Seite lädt <code>floater_&lt;werk&gt;.json</code> (oder Fallback) und erstellt eine neue Datei als Download. Danach die JSON im Repo ersetzen und committen.</div>
    <button class="btn" id="btnLoad">Neu laden</button>
    <button class="btn secondary" id="btnDownload">JSON herunterladen</button>
    <span id="meta" style="margin-left:10px;color:#4b5b65;"></span>
    <div class="error" id="err"></div>
    <table class="table" id="tbl" style="display:none;">
      <thead><tr><th>Spediteur</th><th>Wert</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
const WERK=(params.get('werk')||'').toLowerCase();
function fileCandidates(){
  const cand=[];
  if(WERK) cand.push('floater_'+WERK+'.json');
  cand.push('floater.json');
  return cand;
}
async function fetchFirstExisting(candidates){
  let last=null;
  for(const f of candidates){
    try{ const r=await fetch(f,{cache:'no-store'}); if(r.ok) return {name:f, text: await r.text()}; last=new Error(f+': HTTP '+r.status); }
    catch(e){ last=e; }
  }
  throw last||new Error('Datei nicht gefunden');
}
function showError(msg){ const e=document.getElementById('err'); e.style.display='block'; e.textContent=msg; }
function clearError(){ const e=document.getElementById('err'); e.style.display='none'; e.textContent=''; }
let DATA={};
let FILE_NAME='';
function render(){ 
  const tbl=document.getElementById('tbl'); 
  const tb=tbl.querySelector('tbody'); tb.innerHTML='';
  const keys=Object.keys(DATA).sort((a,b)=>a.localeCompare(b,'de'));
  for(const k of keys){
    const tr=document.createElement('tr');
    const td1=document.createElement('td'); td1.textContent=k;
    const td2=document.createElement('td');
    const inp=document.createElement('input'); inp.type='number'; inp.step='0.01'; inp.value=String(DATA[k]??'');
    inp.style.width='140px';
    inp.addEventListener('input',()=>{ DATA[k]=Number(inp.value); });
    td2.appendChild(inp);
    tr.appendChild(td1); tr.appendChild(td2);
    tb.appendChild(tr);
  }
  tbl.style.display='table';
}
async function load(){
  clearError();
  try{
    const r=await fetchFirstExisting(fileCandidates());
    FILE_NAME = r.name;
    DATA = JSON.parse(r.text||'{}');
    document.getElementById('meta').textContent = `Werk: ${WERK||'—'} • Datei: ${FILE_NAME} • Spediteure: ${Object.keys(DATA).length}`;
    render();
  }catch(e){ showError(String(e)); }
}
function download(){
  const name = (WERK? 'floater_'+WERK+'.json' : 'floater.json');
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
document.getElementById('btnLoad').addEventListener('click',load);
document.getElementById('btnDownload').addEventListener('click',download);
load();
</script>
</body>
</html>
