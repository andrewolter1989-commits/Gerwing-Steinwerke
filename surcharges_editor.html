<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Zuschläge Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f7f9}
    .brand{color:#0a5b7a;font-weight:900}
    .card{border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08);}
    .btn-primary{background:#0a5b7a;border-color:#0a5b7a;font-weight:800;border-radius:12px}
  </style>
</head>
<body>
<div class="container py-4" style="max-width:1200px">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
    <div>
      <h1 class="h3 brand mb-1">Zuschläge Editor</h1>
      <div class="text-muted">Baustelle / 2. Stopp / 3. Stopp bearbeiten und JSON herunterladen.</div>
    </div>
    <a class="btn btn-outline-secondary" href="index.html">Zurück</a>
  </div>

  <div class="card p-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label fw-bold">Werk</label>
        <select id="werk" class="form-select">
          <option value="holdorf">Holdorf</option>
          <option value="clausnitz">Clausnitz</option>
        </select>
      </div>
      <div class="col-md-8 d-flex gap-2">
        <button id="btnLoad" class="btn btn-primary">Laden</button>
        <button id="btnDl" class="btn btn-outline-secondary">Download surcharges_*.json</button>
      </div>
    </div>

    <div class="table-responsive mt-3">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Spediteur</th>
            <th style="width:220px">Baustelle (€)</th>
            <th style="width:220px">2. Stopp (€)</th>
            <th style="width:220px">3. Stopp (€)</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
let DATA=null;

function dl(filename, text){
  const blob = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

async function load(){
  const werk = document.getElementById("werk").value;
  const surFile = `surcharges_${werk}.json`;
  const zonesFile = `zones_${werk}.csv`;
  const ratesFile = `rates_${werk}.csv`;
  const [sTxt, zTxt, rTxt] = await Promise.all([fetchText(surFile), fetchText(zonesFile), fetchText(ratesFile)]);
  const sur = JSON.parse(sTxt);
  const zones = buildZones(parseCsv(zTxt));
  const rates = buildRates(parseCsv(rTxt));
  const forwarders = [...new Set([...zones.keys()].filter(x=>rates.has(x)))].sort((a,b)=>a.localeCompare(b,"de"));
  DATA={werk, sur, forwarders};
  render();
}

function render(){
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  for(const f of DATA.forwarders){
    const b = DATA.sur.baustelle?.[f] ?? 0;
    const s2 = DATA.sur.stop2?.[f] ?? 0;
    const s3 = DATA.sur.stop3?.[f] ?? 0;
    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td>${f}</td>
      <td><input class="form-control" data-k="baustelle" data-f="${f}" value="${b}"></td>
      <td><input class="form-control" data-k="stop2" data-f="${f}" value="${s2}"></td>
      <td><input class="form-control" data-k="stop3" data-f="${f}" value="${s3}"></td>
    `;
    tbody.appendChild(tr);
  }
}

document.getElementById("btnLoad").addEventListener("click", async ()=>{
  try{ await load(); }catch(e){ alert(e.message||String(e)); }
});

document.getElementById("btnDl").addEventListener("click", ()=>{
  if(!DATA){ alert("Bitte zuerst laden."); return; }
  const out={baustelle:{}, stop2:{}, stop3:{}};
  const inputs=[...document.querySelectorAll("input[data-k]")];
  for(const inp of inputs){
    const k = inp.getAttribute("data-k");
    const f = inp.getAttribute("data-f");
    const n = parseEuro(inp.value); // handles comma etc
    out[k][f] = Number.isFinite(n) ? n : 0;
  }
  dl(`surcharges_${DATA.werk}.json`, JSON.stringify(out, null, 2));
});
</script>
</body>
</html>
