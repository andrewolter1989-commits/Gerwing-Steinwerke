<!DOCTYPE html>
<html lang="de">
<head><meta charset="UTF-8"/><title>Baustellenzuschläge</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>
:root { --gp-blue: #005A99; --gp-teal: #00A99D; --gp-light: #F2F6F8; --gp-dark: #333333; --gp-white: #FFFFFF; }
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background-color: var(--gp-light); color: var(--gp-dark); margin: 2rem; }
h1 { color: var(--gp-blue); margin-bottom: 1rem; }
table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
th, td { padding: 0.5rem 1rem; border: 1px solid var(--gp-dark); }
th { background-color: var(--gp-blue); color: var(--gp-white); text-align: left; }
input[type="number"] { width: 100%; padding: 0.3rem 0.5rem; border: 1px solid var(--gp-dark); border-radius: 4px; }
.buttons { margin-top: 1rem; }
button { background-color: var(--gp-teal); color: var(--gp-white); border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-right: 0.5rem; }
button:hover { background-color: var(--gp-blue); }
</style>
</head>
<body>
<script>
const pwd = prompt("Passwort für Zuschläge:");
if (pwd !== "Andre") { alert("Falsches Passwort"); location.href = "tarifrechner.html"; }
</script>
<h1>Baustellenzuschläge</h1>
<table>
  <thead>
    <tr>
      <th>Spediteur</th>
      <th>Baustellenkosten</th>
      <th>2. Stopp</th>
      <th>3. Stopp</th>
    </tr>
  </thead>
  <tbody id="formBody"></tbody>
</table>
<div class="buttons">
  <button onclick="alert('Gespeichert');">Speichern</button>
  <button onclick="location.href='tarifrechner.html';">Zurück</button>
</div>
<script>
const forwarders = ["Berghegger", "Böckmann", "DB Schenker", "Elvis", "Hartmann", "Koch", "Oelrich", "Sievert"];
const tbody = document.getElementById('formBody');

forwarders.forEach((fwd, idx) => {
  const tr = document.createElement('tr');
  const tdLabel = document.createElement('td');
  tdLabel.textContent = fwd;
  tr.appendChild(tdLabel);

  ['Baustellenkosten', '2. Stopp', '3. Stopp'].forEach((ph, i) => {
    const td = document.createElement('td');
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.id = `bz_${idx}_${i+1}`;
    inp.placeholder = ph;
    inp.value = localStorage.getItem(`baustelle_${idx}_${i+1}`) || '0';
    inp.onchange = () => localStorage.setItem(`baustelle_${idx}_${i+1}`, inp.value);
    td.appendChild(inp);
    tr.appendChild(td);
  });

  tbody.appendChild(tr);
});
</script>
</body>
</html>
